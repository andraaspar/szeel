[package]
name = "szeel"
version = "0.1.0"
edition = "2024"

[dependencies]
kdl = "6.7.1"
miette = { version = "7.6.0", features = ["fancy"] }
png = "0.18.1"
rayon = "1.12.0"

[dev-dependencies]
criterion = "0.8.2"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[[bench]]
name = "render"
harness = false

[workspace]
members = [".", "web/src-tauri"]

# The editor's dev build (`npm run dev` in web/) renders with these, so keep
# them optimized.
[profile.dev.package.szeel]
opt-level = 3

[profile.dev.package.rayon-core]
opt-level = 3
